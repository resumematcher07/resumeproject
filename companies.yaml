# Global company career-source registry.
#
# ATS readers supported by matcher/services/jobs.py:
#   greenhouse -> boards.greenhouse.io/<token>
#   lever      -> jobs.lever.co/<token>
#   ashby      -> jobs.ashbyhq.com/<token>
#   workable   -> apply.workable.com/<token>
#   jsonld     -> career page containing schema.org JobPosting JSON-LD
#
# `job_functions`, `industries`, `regions` are metadata. They do not restrict crawling;
# they enrich each posting and make the registry useful for resume/job filtering.
# ATS tokens can change. Unreachable sources are reported instead of stopping the search.

companies:
