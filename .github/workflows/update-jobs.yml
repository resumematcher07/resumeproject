name: Update job snapshot

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours (UTC)
  workflow_dispatch: {}         # "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-scraper.txt

      - run: pip install -r requirements-scraper.txt

      - name: Install headless Chromium (for JavaScript-only IT-park pages)
        run: playwright install --with-deps chromium

      - name: Fetch previous snapshot (safety check against broken runs)
        run: |
          mkdir -p data
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/data/jobs_snapshot.json.gz" \
            -o data/jobs_snapshot.json.gz || echo "no previous snapshot yet"

      - name: Scrape all sources
        run: python manage.py update_snapshot

      - name: Publish snapshot to the "data" branch
        run: |
          mkdir /tmp/pub && cp data/jobs_snapshot.json.gz /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name  "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          git add jobs_snapshot.json.gz
          git commit -q -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
